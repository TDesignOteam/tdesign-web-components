name: TAG_PUSH

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:types
      - run: pnpm run check:pack

      - name: Validate release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          UI_VERSION="$(node -p "require('./packages/tdesign-web-components/package.json').version")"
          CHAT_VERSION="$(node -p "require('./packages/tdesign-web-components-chat/package.json').version")"

          test "$UI_VERSION" = "$CHAT_VERSION"
          test "$TAG_NAME" = "$UI_VERSION"

          case "$TAG_NAME" in
            *-alpha.*) DIST_TAG=alpha ;;
            *-beta.*) DIST_TAG=beta ;;
            *-rc.*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac

          echo "PACKAGE_VERSION=$UI_VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Create publish tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          pnpm --dir packages/tdesign-web-components pack --pack-destination "$RUNNER_TEMP/npm-pack"
          pnpm --dir packages/tdesign-web-components-chat pack --pack-destination "$RUNNER_TEMP/npm-pack"

      - name: Publish UI
        run: npm publish "$RUNNER_TEMP/npm-pack/tdesign-web-components-$PACKAGE_VERSION.tgz" --access public --tag "$DIST_TAG"

      - name: Publish Chat
        run: npm publish "$RUNNER_TEMP/npm-pack/tdesign-web-components-chat-$PACKAGE_VERSION.tgz" --access public --tag "$DIST_TAG"
