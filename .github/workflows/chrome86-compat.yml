name: CHROME86_COMPAT

on:
  pull_request:
  workflow_dispatch:

env:
  SELENIUM_CHROME86_IMAGE: selenium/standalone-chrome:86.0.4240.75-chromedriver-86.0.4240.22

jobs:
  chrome86-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - run: npm install

      - run: npm run build

      - name: Start Chrome 86 Selenium
        run: |
          docker run -d \
            --name selenium-chrome86 \
            --shm-size=2g \
            --add-host=host.docker.internal:host-gateway \
            -p 4444:4444 \
            "$SELENIUM_CHROME86_IMAGE"

      - name: Wait for Selenium
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs selenium-chrome86
          exit 1

      - name: Run Chrome 86 smoke test
        env:
          CHROME86_WEBDRIVER_URL: http://127.0.0.1:4444/wd/hub
          CHROME86_HOSTNAME: host.docker.internal
        run: npm run compat:chrome86

      - name: Dump Selenium logs
        if: always()
        run: docker logs selenium-chrome86 || true

      - name: Stop Chrome 86 Selenium
        if: always()
        run: docker rm -f selenium-chrome86 || true
