name: sync-to-cnb
on:
  - push
  - delete

jobs:
  call-cnb-sync:
    uses: TDesignOteam/workflows/.github/workflows/reusable-cnb-sync.yml@main
    with:
      github-repo: TDesignOteam/tdesign-web-components
      cnb-repo: tencent/tdesign/tdesign-web-components
    secrets:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
