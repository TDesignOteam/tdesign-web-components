# =============================================================================
# MAIN_PULL_REQUEST
# 触发时机: PR 创建/更新时
# 主要流程: 单元测试 + 上传 PR 元信息 + 并行构建两个站点
#
# 与下游 PREVIEW_PUBLISH 的契约 (artifact 命名):
# - pr-id                          (必有, PR 元信息)
# - tdesign-web-components-site    (必有, web-components 主站构建产物)
# - tdesign-vue-next-chat-site     (可选, chat 构建失败时不存在；
#                                   源固定来自 Tencent/tdesign-vue-next)
#
# 设计原则:
# - 每个构建 job 只负责构建并上传自己的 artifact
# - PR 元信息由独立 job 上传，与构建解耦
# - build-chat 用 continue-on-error 让其失败不阻塞主链路；下游通过 artifact
#   存在性独立判断，避免上游 conclusion 误导
# =============================================================================
name: MAIN_PULL_REQUEST

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同一 PR 的新 push 取消旧的构建，节省资源
concurrency:
  group: main-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 最小权限原则
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. 上传 PR 元信息 (独立 job, 与构建解耦)
  # ─────────────────────────────────────────────────────────────────────────
  upload-pr-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Write PR number
        run: echo "${{ github.event.pull_request.number }}" > pr-id.txt

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 2

  # ─────────────────────────────────────────────────────────────────────────
  # 2. 单元测试
  # ─────────────────────────────────────────────────────────────────────────
  unit-test:
    uses: TDesignOteam/workflows/.github/workflows/reusable-unit-test.yml@main
    with:
      node-version-file: .node-version
      skip-site: true
      package-manager: pnpm

  # ─────────────────────────────────────────────────────────────────────────
  # 3. 构建 Web Components Site (主链路, 必须成功)
  # ─────────────────────────────────────────────────────────────────────────
  build-web-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm -C playground/site run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdesign-web-components-site
          path: _site
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 4. 构建 Chat Site (辅链路, 失败不阻塞主链路)
  #
  # 使用 continue-on-error: true 让此 job 失败不影响整体 workflow 的 success
  # conclusion，保证下游 PREVIEW_PUBLISH 仍会触发，使主站预览链路完整执行。
  # 下游 deploy-chat 通过 artifact 存在性独立判断是否部署，不依赖本 job 状态。
  # ─────────────────────────────────────────────────────────────────────────
  build-chat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout tdesign-vue-next
        uses: actions/checkout@v6
        with:
          # chat 子站源码固定来自社区上游仓库
          repository: Tencent/tdesign-vue-next
          ref: develop
          submodules: recursive
          path: _vue-next

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            _vue-next/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: _vue-next
        run: pnpm install --no-frozen-lockfile

      - name: Patch vite config
        run: |
          node script/patch-vite-config.mjs \
            _vue-next/packages/tdesign-vue-next-chat/site/vite.config.ts \
            "$GITHUB_WORKSPACE"

      - name: Build site
        working-directory: _vue-next
        run: pnpm -C packages/tdesign-vue-next-chat/site run preview

      # 构建失败则此 step 不执行, artifact 不会生成, 下游会自动跳过部署
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdesign-vue-next-chat-site
          path: _vue-next/packages/tdesign-vue-next-chat/site/dist
          retention-days: 5
