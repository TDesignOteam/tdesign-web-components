name: main-pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  call-unit-test:
    uses: TDesignOteam/workflows/.github/workflows/reusable-unit-test.yml@main
    with:
      node-version-file: .node-version
      skip-site: true
      package-manager: pnpm

  build-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check:types

      - name: Build libraries
        run: pnpm run build:chat

      - name: Verify declaration paths
        run: |
          if rg "@tdesign/common-js" packages/tdesign-web-components/lib packages/tdesign-web-components-chat/lib --glob "*.{js,d.ts}"; then
            echo "Found external @tdesign/common-js in publish lib (common-js should be bundled)"
            exit 1
          fi
          if rg "@tdesign/web-components-shared" packages/tdesign-web-components/lib packages/tdesign-web-components-chat/lib --glob "*.{js,d.ts}"; then
            echo "Found external @tdesign/web-components-shared in publish lib (shared should be bundled)"
            exit 1
          fi
          if ! rg "packages/shared" packages/tdesign-web-components/lib --glob "*.js" -q; then
            echo "UI lib should bundle shared under lib/packages/shared"
            exit 1
          fi
          if rg "from ['\"]@tdesign/|import\(['\"]@tdesign/|import ['\"]@tdesign/" packages/tdesign-web-components-chat/lib --glob "*.d.ts" | grep -vE '@tdesign/(web-components|ai-chat-engine)'; then
            echo "Found unexpected @tdesign/* imports in chat lib/*.d.ts"
            exit 1
          fi
          if rg "packages/components/" packages/tdesign-web-components/lib packages/tdesign-web-components-chat/lib --glob "*.{js,d.ts}"; then
            echo "Found non-flattened monorepo paths in lib/"
            exit 1
          fi
          if find packages/shared/src packages/components packages/pro-components/chat -name '*.d.ts' ! -path '*/types/*' ! -path '*/dist/*' 2>/dev/null | grep -q .; then
            echo "Found .d.ts pollution in source directories"
            exit 1
          fi
          if find packages/tdesign-web-components-chat/lib -path '*/mock/*' -name '*.js' 2>/dev/null | grep -q .; then
            echo "Found mock demo files in chat publish lib (should be excluded from build)"
            exit 1
          fi
