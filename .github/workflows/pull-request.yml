# 文件名建议统一为 pull-request.yml
# 应用 test-build.yml 的 demo

name: MAIN_PULL_REQUEST

on:
  pull_request:

jobs:
  call-test-build:
    uses: TDesignOteam/workflows/.github/workflows/reusable-unit-test.yml@main
    with:
      node-version-file: .node-version
      skip-site: true
      package-manager: pnpm

  build-vue-next-chat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Checkout tdesign-vue-next
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository_owner }}/tdesign-vue-next
          ref: develop
          submodules: recursive
          path: _vue-next

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies for vue-next
        working-directory: _vue-next
        run: pnpm install --no-frozen-lockfile

      - name: Patch chat site to use current repo web-components
        run: |
          node script/patch-vite-config.mjs \
            _vue-next/packages/tdesign-vue-next-chat/site/vite.config.ts \
            $GITHUB_WORKSPACE

      - name: Build vue-next chat site
        working-directory: _vue-next
        run: pnpm -C packages/tdesign-vue-next-chat/site run preview

      - name: Upload chat site artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vue-next-chat-site
          path: _vue-next/packages/tdesign-vue-next-chat/site/dist
          retention-days: 5

      - name: Save PR ID
        if: always()
        run: echo ${{ github.event.number }} > vue-next-chat-pr-id.txt

      - name: Upload PR ID artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vue-next-chat-pr-id
          path: vue-next-chat-pr-id.txt
          retention-days: 5

  build-webc-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build webc site
        run: pnpm -C playground/site run build

      - name: Upload webc site artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: _site
          path: _site
          retention-days: 5

      - name: Save PR ID
        if: always()
        run: echo ${{ github.event.number }} > pr-id.txt

      - name: Upload PR ID artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr
          path: pr-id.txt
          retention-days: 5
