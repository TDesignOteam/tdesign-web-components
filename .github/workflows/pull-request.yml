# =============================================================================
# MAIN_PULL_REQUEST
# 触发时机: PR 创建/更新时
# 主要流程: 单元测试 + 上传 PR 元信息 + 并行构建两个站点
#
# 与下游 PREVIEW_PUBLISH 的契约:
# - 上游整体 conclusion == 'success' 才触发下游
# - 下游通过各自 artifact 独立判断是否需要部署该站点：
#     * web-components-pr-id  (必有，PR 元信息)
#     * web-components-site   (必有，web-components 构建产物)
#     * chat-site             (可选，chat 构建失败时不存在)
# - build-chat 使用 `continue-on-error: true` 使 chat 构建失败不阻塞主链路，
#   下游 deploy-chat 通过 artifact 是否存在来决定是否部署
# =============================================================================
name: MAIN_PULL_REQUEST

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同一 PR 的新 push 取消旧的构建，节省资源
concurrency:
  group: main-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 最小权限原则
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. 上传 PR 元信息 (独立 job，与构建解耦)
  #    下游 workflow 通过此 artifact 获取 PR number 用于评论
  # ─────────────────────────────────────────────────────────────────────────
  upload-pr-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Write PR number
        run: echo "${{ github.event.pull_request.number }}" > web-components-pr-id.txt

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-components-pr-id
          path: web-components-pr-id.txt
          retention-days: 2

  # ─────────────────────────────────────────────────────────────────────────
  # 2. 单元测试
  # ─────────────────────────────────────────────────────────────────────────
  unit-test:
    uses: TDesignOteam/workflows/.github/workflows/reusable-unit-test.yml@main
    with:
      node-version-file: .node-version
      skip-site: true
      package-manager: pnpm

  # ─────────────────────────────────────────────────────────────────────────
  # 3. 构建 Web Components Site (主链路，必须成功)
  # ─────────────────────────────────────────────────────────────────────────
  build-web-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm -C playground/site run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-components-site
          path: _site
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────
  # 4. 构建 Vue Next Chat Site (辅链路，失败不阻塞主链路)
  #
  # 使用 `continue-on-error: true` 让此 job 失败不影响整体 workflow
  # 的 success conclusion，保证下游 PREVIEW_PUBLISH 仍会触发，使
  # web-components 的预览链路完整执行。
  # 下游 deploy-chat 通过 artifact 存在性独立判断是否部署，不依赖本 job 的状态。
  # ─────────────────────────────────────────────────────────────────────────
  build-chat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Checkout tdesign-vue-next
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository_owner }}/tdesign-vue-next
          ref: develop
          submodules: recursive
          path: _vue-next

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          # 明确指定 lockfile 路径，否则默认只在根目录找，命中不了缓存
          cache-dependency-path: |
            pnpm-lock.yaml
            _vue-next/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: _vue-next
        run: pnpm install --no-frozen-lockfile

      - name: Patch vite config
        run: |
          node script/patch-vite-config.mjs \
            _vue-next/packages/tdesign-vue-next-chat/site/vite.config.ts \
            "$GITHUB_WORKSPACE"

      - name: Build site
        working-directory: _vue-next
        run: pnpm -C packages/tdesign-vue-next-chat/site run preview

      # 构建失败则此 step 不执行，artifact 不会生成，下游会自动跳过部署
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chat-site
          path: _vue-next/packages/tdesign-vue-next-chat/site/dist
          retention-days: 5
