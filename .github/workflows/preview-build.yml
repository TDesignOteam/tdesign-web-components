name: preview-build

on:
  pull_request:
    branches: [develop, main, next]
    types: [opened, synchronize, reopened]

jobs:
  tdesign-web-components-site:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.number }} > pr-id.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/tdesign-web-components/site run build --mode=preview

      - run: cp packages/tdesign-web-components/site/dist/index.html packages/tdesign-web-components/site/dist/200.html

      - uses: actions/upload-artifact@v7
        with:
          name: tdesign-web-components-site
          path: packages/tdesign-web-components/site/dist
          retention-days: 5

  tdesign-web-components-chat-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/tdesign-web-components-chat/site run build --mode=preview

      - run: cp packages/tdesign-web-components-chat/site/dist/index.html packages/tdesign-web-components-chat/site/dist/200.html

      - uses: actions/upload-artifact@v7
        with:
          name: tdesign-web-components-chat-site
          path: packages/tdesign-web-components-chat/site/dist
          retention-days: 5
