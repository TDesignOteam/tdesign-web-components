# =============================================================================
# PREVIEW_PUBLISH
# 触发时机: MAIN_PULL_REQUEST workflow 成功完成时
# 主要流程: preflight 闸门 → 并行部署各站点 → 汇总评论
#
# 设计说明:
# - 使用 workflow_run 是为了让 fork PR 也能访问 secrets 进行部署
# - preflight 作为统一闸门: conclusion == success 且事件来自 pull_request 才继续
#   其他情况 (失败 / 取消 / push 触发等) 整体 skipped，不会出现 "No jobs were run"
# - 每个 deploy job 通过 artifact 存在性独立判断:
#     * artifact 存在  → 正常部署
#     * artifact 不存在 → 跳过该站点（chat 失败时的典型场景）
#   不依赖上游 job 的成功状态，实现松耦合
# =============================================================================
name: PREVIEW_PUBLISH

on:
  workflow_run:
    workflows: ['MAIN_PULL_REQUEST']
    types:
      - completed

# 同一个 PR 的并发部署，新的顶掉旧的，避免竞态覆盖
concurrency:
  group: preview-publish-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_repository.full_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 0. Preflight: 统一闸门
  #    - 仅当 MAIN_PULL_REQUEST conclusion == success 且事件来自 pull_request 时继续
  #    - 其他情况下游 jobs 因 needs 级联 skip，整个 workflow 标记为 skipped
  # ─────────────────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    outputs:
      pr_id: ${{ steps.pr.outputs.id }}
      web_components_domain: ${{ steps.domains.outputs.web_components_domain }}
      chat_domain: ${{ steps.domains.outputs.chat_domain }}
    steps:
      - name: Download PR metadata
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: web-components-pr-id
          path: ./pr-id

      - name: Extract PR number
        id: pr
        run: |
          PR_ID=$(cat ./pr-id/web-components-pr-id.txt)
          if [ -z "$PR_ID" ]; then
            echo "::error::Failed to extract PR id from artifact"
            exit 1
          fi
          echo "id=$PR_ID" >> "$GITHUB_OUTPUT"

      - name: Compute preview domains
        id: domains
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
        run: |
          {
            echo "web_components_domain=https://preview-pr-${PR_ID}-tdesign-web-components.surge.sh"
            echo "chat_domain=https://preview-pr-${PR_ID}-tdesign-web-components-chat.surge.sh"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # 1. 部署 Web Components Site (主链路)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-web-components:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: web-components-site
          path: ./web-components-site

      - name: Prepare SPA fallback
        run: cp ./web-components-site/index.html ./web-components-site/200.html

      - name: Deploy to Surge.sh
        run: |
          npx surge --project ./web-components-site \
            --domain ${{ needs.preflight.outputs.web_components_domain }} \
            --token ${{ secrets.TDESIGN_SURGE_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # 2. 部署 Vue Next Chat Site (辅链路)
  #
  # 通过 artifact 存在性自主判断:
  # - artifact 存在 → 正常部署
  # - artifact 不存在 (chat 构建失败) → 优雅跳过，不污染整体状态
  # ─────────────────────────────────────────────────────────────────────────
  deploy-chat:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      # if_no_artifact_found: warn 使 artifact 不存在时不 fail，
      # 通过 download.outputs.found_artifact 判断是否继续部署
      - name: Download artifact
        id: download
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: chat-site
          path: ./chat-site
          if_no_artifact_found: warn

      - name: Skip if artifact missing
        if: steps.download.outputs.found_artifact != 'true'
        run: |
          echo "::notice::chat-site artifact not found, skipping chat deployment"
          echo "CHAT_SKIPPED=true" >> "$GITHUB_ENV"

      - name: Prepare SPA fallback
        if: steps.download.outputs.found_artifact == 'true'
        run: cp ./chat-site/index.html ./chat-site/200.html

      - name: Deploy to Surge.sh
        if: steps.download.outputs.found_artifact == 'true'
        run: |
          npx surge --project ./chat-site \
            --domain ${{ needs.preflight.outputs.chat_domain }} \
            --token ${{ secrets.TDESIGN_SURGE_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # 3. 汇总报告评论
  # ─────────────────────────────────────────────────────────────────────────
  report-comment:
    if: always() && needs.preflight.result == 'success'
    needs:
      - preflight
      - deploy-web-components
      - deploy-chat
    runs-on: ubuntu-latest
    steps:
      - name: Collect job results
        id: report
        uses: actions/github-script@v7
        env:
          WEB_COMPONENTS_DOMAIN: ${{ needs.preflight.outputs.web_components_domain }}
          CHAT_DOMAIN: ${{ needs.preflight.outputs.chat_domain }}
          WEB_COMPONENTS_RESULT: ${{ needs.deploy-web-components.result }}
          CHAT_RESULT: ${{ needs.deploy-chat.result }}
        with:
          script: |
            const {
              WEB_COMPONENTS_DOMAIN,
              CHAT_DOMAIN,
              WEB_COMPONENTS_RESULT,
              CHAT_RESULT,
            } = process.env;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const successIcon = `<img width="16" alt="完成" src="https://user-images.githubusercontent.com/15634204/150816437-9f5bb788-cd67-4cbc-9897-b82d74e9aa65.png" />`;
            const failureIcon = `<img width="16" alt="失败" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png" />`;

            const buildRow = (name, result, domain) => {
              const ok = result === 'success';
              const icon = ok ? successIcon : failureIcon;
              const link = ok ? domain : runUrl;
              return `| ${name} | [${icon}](${link}) |`;
            };

            const comment = [
              `# 🌐 TDesign Web Components Preview [Open](${runUrl})`,
              '',
              '| Component | Preview |',
              '| --------- | :--: |',
              buildRow('@tdesign/web-components', WEB_COMPONENTS_RESULT, WEB_COMPONENTS_DOMAIN),
              buildRow('@tdesign/web-components-chat (vue-next)', CHAT_RESULT, CHAT_DOMAIN),
              '',
              '<!-- AUTO_PREVIEW_HOOK -->',
            ].join('\n');

            core.setOutput('comment', comment);

      - name: Post comment
        uses: actions-cool/maintain-one-comment@v3
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ needs.preflight.outputs.pr_id }}
          body: ${{ steps.report.outputs.comment }}
          body-include: '<!-- AUTO_PREVIEW_HOOK -->'
