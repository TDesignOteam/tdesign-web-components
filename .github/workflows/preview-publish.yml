# =============================================================================
# PREVIEW_PUBLISH - 预览发布工作流：获取上下文 → 部署 → 汇总报告
# =============================================================================
name: PREVIEW_PUBLISH

on:
  workflow_run:
    workflows: ['MAIN_PULL_REQUEST']
    types:
      - completed

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY: 部署阶段
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ===========================================================================
  # CONTEXT: 获取 PR ID 和域名配置
  # ===========================================================================
  get-context:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pr_id: ${{ steps.pr.outputs.id }}
      web_components_domain: ${{ steps.web-components-domain.outputs.web_components_domain }}
      chat_domain: ${{ steps.chat-domain.outputs.chat_domain }}
    steps:
      # ── Download ─────────────────────────────────────────────────────────
      - name: Download web-components PR metadata
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: web-components-pr-id
          path: ./pr-id

      - name: Download chat PR metadata
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: chat-pr-id
          path: ./pr-id

      # ── Extract ───────────────────────────────────────────────────────────
      - name: Extract PR number
        id: pr
        run: |
          PR_ID=$(cat ./pr-id/web-components-pr-id.txt 2>/dev/null || cat ./pr-id/chat-pr-id.txt)
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      # ── Config ─────────────────────────────────────────────────────────────
      - name: Set web-components domain
        id: web-components-domain
        run: echo "web_components_domain=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-web-components.surge.sh" >> $GITHUB_OUTPUT

      - name: Set chat domain
        id: chat-domain
        run: echo "chat_domain=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-web-components-chat.surge.sh" >> $GITHUB_OUTPUT

  # ===========================================================================
  # DEPLOY: Web Components Site
  # ===========================================================================
  deploy-web-components:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: get-context
    steps:
      # ── Download ─────────────────────────────────────────────────────────
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: web-components-site
          path: ./web-components-site

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Prepare SPA fallback
        run: cp ./web-components-site/index.html ./web-components-site/200.html

      - name: Deploy to Surge.sh
        run: |
          npx surge --project ./web-components-site \
            --domain ${{ needs.get-context.outputs.web_components_domain }} \
            --token ${{ secrets.TDESIGN_SURGE_TOKEN }}

  # ===========================================================================
  # DEPLOY: Vue Next Chat Site
  # ===========================================================================
  deploy-chat:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: get-context
    steps:
      # ── Download ─────────────────────────────────────────────────────────
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: chat-site
          path: ./chat-site

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Prepare SPA fallback
        run: cp ./chat-site/index.html ./chat-site/200.html

      - name: Deploy to Surge.sh
        run: |
          npx surge --project ./chat-site \
            --domain ${{ needs.get-context.outputs.chat_domain }} \
            --token ${{ secrets.TDESIGN_SURGE_TOKEN }}

  # ===========================================================================
  # REPORT: 汇总报告评论
  # ===========================================================================
  report-comment:
    if: always()
    needs:
      - get-context
      - deploy-web-components
      - deploy-chat
    runs-on: ubuntu-latest
    steps:
      # ── Collect ───────────────────────────────────────────────────────────
      - name: Collect job results
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const pr_id = ${{ needs.get-context.outputs.pr_id }};
            const web_components_domain = "${{ needs.get-context.outputs.web_components_domain }}";
            const chat_domain = "${{ needs.get-context.outputs.chat_domain }}";

            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const sites = {
              "deploy-web-components": { status: "", report_url: "", package_name: "@tdesign/web-components" },
              "deploy-chat": { status: "", report_url: "", package_name: "@tdesign/web-components-chat (vue-next)" },
            };

            const success_icon = `<img width="16" alt="完成" src="https://user-images.githubusercontent.com/15634204/150816437-9f5bb788-cd67-4cbc-9897-b82d74e9aa65.png" />`;
            const failure_icon = `<img width="16" alt="失败" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png" />`;

            jobs
              .filter((job) => job.name.startsWith("deploy-"))
              .map((job) => {
                sites[job.name].status = failure_icon;
                sites[job.name].report_url = job.html_url;

                if (job.conclusion === "success") {
                  sites[job.name].status = success_icon;
                  if (job.name === "deploy-web-components") {
                    sites[job.name].report_url = web_components_domain;
                  }
                  if (job.name === "deploy-chat") {
                    sites[job.name].report_url = chat_domain;
                  }
                }
              });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const comment = `
# 🌐 TDesign Web Components Preview [Open](${runUrl})

| Component | Preview |
| --------- | :--: |
${Object.keys(sites)
  .map((site) => {
    const preview_text = `[${sites[site].status}](${sites[site].report_url})`;
    return `| ${sites[site].package_name} | ${preview_text} |`;
  })
  .join("\n")}

<!-- AUTO_PREVIEW_HOOK -->
`;

            core.setOutput('comment', comment);

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Post comment
        uses: actions-cool/maintain-one-comment@v3
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ needs.get-context.outputs.pr_id }}
          body: ${{ steps.report.outputs.comment }}
          body-include: '<!-- AUTO_PREVIEW_HOOK -->'