# 文件名建议统一为 preview-publish
# 应用 preview.yml 的 demo
name: PREVIEW_PUBLISH

on:
  workflow_run:
    workflows: ['MAIN_PULL_REQUEST']
    types:
      - completed

jobs:
  deploy-vue-next-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Download PR ID artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: vue-next-chat-pr-id
          path: ./pr-id

      - name: Set PR ID
        id: pr
        run: echo "id=$(cat ./pr-id/vue-next-chat-pr-id.txt)" >> $GITHUB_OUTPUT

      - name: Download chat site artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: vue-next-chat-site
          path: ./chat-site

      - name: Deploy to Surge.sh
        id: deploy
        run: |
          export DEPLOY_DOMAIN=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-webc-chat.surge.sh
          npx surge --project ./chat-site --domain $DEPLOY_DOMAIN --token ${{ secrets.TDESIGN_SURGE_TOKEN }}
          echo "url=$DEPLOY_DOMAIN" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: success()
        uses: actions-cool/maintain-one-comment@v3.3.0
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ steps.pr.outputs.id }}
          body: |-
            ## 🤖 Vue Next Chat Site Preview
            | Component | Preview |
            | --------- | :--: |
            | @tdesign/web-components-chat (vue-next) | [🟢 Online](${{ steps.deploy.outputs.url }}) |

            <!-- AUTO_VUE_NEXT_CHAT_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_VUE_NEXT_CHAT_PREVIEW_HOOK -->'

      - name: Comment failure on PR
        if: failure()
        uses: actions-cool/maintain-one-comment@v3.3.0
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ steps.pr.outputs.id }}
          body: |-
            ## 🤖 Vue Next Chat Site Preview
            | Component | Preview |
            | --------- | :--: |
            | @tdesign/web-components-chat (vue-next) | [🔴 Failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            <!-- AUTO_VUE_NEXT_CHAT_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_VUE_NEXT_CHAT_PREVIEW_HOOK -->'

  deploy-webc-site:
    runs-on: ubuntu-latest
    steps:
      - name: Download PR ID artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: webc-site-pr-id
          path: ./pr-id

      - name: Set PR ID
        id: pr
        run: echo "id=$(cat ./pr-id/webc-site-pr-id.txt)" >> $GITHUB_OUTPUT

      - name: Download webc site artifact
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ${{ github.event.workflow_run.name }}
          run_id: ${{ github.event.workflow_run.id }}
          name: webc-site
          path: ./webc-site

      - name: Deploy to Surge.sh
        id: deploy
        run: |
          export DEPLOY_DOMAIN=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-webc.surge.sh
          npx surge --project ./webc-site --domain $DEPLOY_DOMAIN --token ${{ secrets.TDESIGN_SURGE_TOKEN }}
          echo "url=$DEPLOY_DOMAIN" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: success()
        uses: actions-cool/maintain-one-comment@v3.3.0
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ steps.pr.outputs.id }}
          body: |-
            ## 🌐 Web Components Site Preview
            | Site | Preview |
            | ---- | :-----: |
            | @tdesign/web-components | [🟢 Online](${{ steps.deploy.outputs.url }}) |

            <!-- AUTO_WEBC_SITE_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_WEBC_SITE_PREVIEW_HOOK -->'

      - name: Comment failure on PR
        if: failure()
        uses: actions-cool/maintain-one-comment@v3.3.0
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          number: ${{ steps.pr.outputs.id }}
          body: |-
            ## 🌐 Web Components Site Preview
            | Site | Preview |
            | ---- | :-----: |
            | @tdesign/web-components | [🔴 Failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            <!-- AUTO_WEBC_SITE_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_WEBC_SITE_PREVIEW_HOOK -->'
