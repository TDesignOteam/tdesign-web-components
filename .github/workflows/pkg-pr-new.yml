name: pkg-pr-new
on: [push, pull_request]

jobs:
  build:
    if: ${{ github.repository == 'TDesignOteam/tdesign-web-components' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install

      - run: pnpm run build

      - run: npx pkg-pr-new publish --packageManager=pnpm,npm,yarn
