# 主流水线配置：仅保留触发规则与分支映射
# 可复用的环境配置 + Stage 片段存放于 .cnb/.stages.yml，流程模板存放于 .cnb/.workflows.yml

include:
  - .cnb/.stages.yml
  - .cnb/.workflows.yml

develop:
  push:
    - !reference [.lint-test-build]

$:
  push:
    # 所有分支 push 时同步到 GitHub
    - !reference [.sync-to-github]

  pull_request:
    - !reference [.pr-check]

  vscode:
    - !reference [.vscode-env]
