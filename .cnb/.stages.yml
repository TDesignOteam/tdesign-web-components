# 可复用的 Stage 片段 — 通过 !reference 插入到各流水线的 stages 中

# 初始化子模块（packages/common 为 submodule）
.init-submodule:
  name: init submodule
  script: git submodule update --init packages/common

# 安装依赖
.install-deps:
  name: install dependencies
  script: pnpm install

# lint（含 check:types + eslint）
.lint:
  name: lint
  script: pnpm run lint

# 单元测试（vitest）
.test:
  name: test
  script: pnpm test

# 构建（chat + ui）
.build:
  name: build
  script: pnpm run build

# 类型检查
.type-check:
  name: type check
  script: pnpm run check:types

# 产物校验（构建 chat 并检查打包产物）
.check-packages:
  name: check packages
  script: pnpm run check:pack

# 同步到 GitHub（rebase 方式，需导入密钥仓库后使用 ${GIT_USERNAME}/${GIT_ACCESS_TOKEN}）
.sync-to-github:
  name: sync to github with rebase
  image: tencentcom/git-sync
  settings:
    target_url: https://github.com/TDesignOteam/tdesign-web-components.git
    auth_type: https
    username: ${GIT_USERNAME}
    password: ${GIT_ACCESS_TOKEN}
